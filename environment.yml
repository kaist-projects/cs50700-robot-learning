# Simulation env for sim/ (and collect/), pinned to what Isaac Lab v3.0.0 in third_party/IsaacLab expects.
# Setup steps are in README.md. Bump these pins together with the submodule.
name: isaacsim
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - --extra-index-url https://pypi.nvidia.com
      - torch==2.11.0
      - torchvision==0.26.0
      - isaacsim[all,extscache]==6.2.0.0
variables:
  PYTHONPATH: sim
